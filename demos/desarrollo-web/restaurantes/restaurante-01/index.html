<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa Brasa — demo</title>
<style>:root{--bg:#14211b;--bg2:#1d2f26;--tx:#f5efe2;--mu:#b9c4b4;--ln:#35493e;--ac:#e9c46a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 Georgia,serif}
.hh{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#2c4a3b,#14211b 70%)}h1{font-size:clamp(2.4rem,8vw,5rem);margin:0 0 .3em}h2{margin:0 0 .6em}
section{padding:64px 6vw;max-width:900px;margin:auto}.b{display:inline-block;border:0;cursor:pointer;background:var(--ac);color:#14211b;padding:12px 26px;border-radius:99px;font:600 1rem system-ui;text-decoration:none;margin:4px}.b.g{background:none;border:1px solid var(--ac);color:var(--ac)}
.t button{background:none;border:1px solid var(--ln);color:var(--mu);padding:8px 18px;border-radius:99px;margin:0 8px 8px 0;cursor:pointer;font:inherit}.t button.on{background:var(--ac);color:#14211b;border-color:var(--ac)}
.it{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px dotted var(--ln)}small{color:var(--mu)}label{display:grid;gap:6px;margin-bottom:14px}input,select{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx)}.er{color:#ff8a8a;min-height:1.2em}.ok{border:1px solid var(--ac);padding:14px;border-radius:12px}</style></head><body>
<div class="hh"><div><h1>Casa Brasa</h1><p style="color:var(--mu)">Cocina de fuego lento. Datos ficticios de demostración.</p><a class="b" href="#menu">Ver menú</a><a class="b g" href="#reservar">Reservar</a></div></div>
<section id="menu"><h2>Menú</h2><div class="t" id="t"></div><div id="l"></div></section>
<section><h2>Horarios y ubicación</h2><p>Mar a dom, 1:00 pm – 10:00 pm. Calle Ejemplo 123 (dirección ficticia).</p></section>
<section id="reservar"><h2>Reservar mesa</h2><form id="f" novalidate style="max-width:420px"><label>Nombre<input name="n"></label><label>Personas<select name="p"><option>2</option><option>4</option><option>6</option></select></label><label>Fecha<input type="date" name="d"></label><div class="er" id="e"></div><button class="b">Probar reservación</button></form><div id="o"></div></section>
<script>const M={Entradas:[["Tostada de atún","Atún, aguacate, chipotle",120],["Sopa de la casa","Del día",95]],Fuertes:[["Costilla braseada","Puré de camote",260],["Pasta al limón","Albahaca y parmesano",190]],Postres:[["Flan de cajeta","Receta de la casa",85],["Helado artesanal","Tres bolas",75]],Bebidas:[["Limonada mineral","Jengibre",55],["Café de olla","Piloncillo y canela",50]]};
const t=document.getElementById("t"),l=document.getElementById("l");const show=k=>{[...t.children].forEach(b=>b.classList.toggle("on",b.textContent===k));l.innerHTML=M[k].map(i=>`<div class="it"><div><b>${i[0]}</b><br><small>${i[1]}</small></div><b>$${i[2]}</b></div>`).join("")};
Object.keys(M).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>show(k);t.append(b)});show("Entradas");
document.getElementById("f").onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.n.value.trim()||!f.d.value){document.getElementById("e").textContent="Escribe tu nombre y elige una fecha.";return}document.getElementById("e").textContent="";document.getElementById("o").innerHTML=`<p class="ok">Reservación simulada para ${f.p.value} personas el ${f.d.value}. En un sitio real se enviaría al restaurante.</p>`}</script></body></html>
